name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest (unit tests only)
        run: pytest -ra --ignore=tests/integration

  integration:
    name: pytest integration (Fortran, ubuntu-latest)
    runs-on: ubuntu-latest
    # Linux-only: GitHub's macos-latest runners do not ship gfortran,
    # and brew-installing it adds ~3 min per run. The runner is OS-agnostic
    # and macOS developers cover that side locally.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make
      - name: Verify gfortran is available
        run: gfortran --version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integration tests
        run: pytest -ra tests/integration

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy src

  canonical-inputs:
    name: canonical-input drift (manifest -> inputs/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # not needed for the input-only check
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Verify committed inputs match manifest.json
        run: python scripts/regenerate_canonical_inputs.py --check

  mechanism-drift:
    name: mechanism-drift guard (SHA contract)
    # SHA-based contract check: verifies the committed metadata's
    # input_sha256 + fortran_source_sha256 fields still match what
    # the manifest + current Fortran source produce. No Fortran build
    # required — this is a fast pure-Python audit. Cross-machine
    # numeric reproducibility of box.exe outputs is intentionally NOT
    # gated here (REAL*4 chemistry products re-order across gfortran
    # versions producing 0.4-4% drift on cascade species — noise, not
    # signal). When a tomas-jax-side aerosol-drift guard lands, that
    # one will need a real build environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Verify Fortran-source + manifest SHAs match committed metadata
        run: python scripts/generate_goldens.py --check
