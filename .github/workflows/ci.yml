name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest (unit tests only)
        run: pytest -ra --ignore=tests/integration

  integration:
    name: pytest integration (Fortran, ubuntu-latest)
    runs-on: ubuntu-latest
    # Linux-only: GitHub's macos-latest runners do not ship gfortran,
    # and brew-installing it adds ~3 min per run. The runner is OS-agnostic
    # and macOS developers cover that side locally.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make
      - name: Verify gfortran is available
        run: gfortran --version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integration tests
        run: pytest -ra tests/integration

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy src

  canonical-inputs:
    name: canonical-input drift (manifest -> inputs/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # not needed for the input-only check
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Verify committed inputs match manifest.json
        run: python scripts/regenerate_canonical_inputs.py --check

  mechanism-drift:
    name: mechanism-drift guard (Fortran on macOS)
    # macOS-only: the Linux gfortran build of `box.exe` triggers a glibc
    # heap-corruption abort in TOMAS report_() (tracked as
    # som-tomas-fortran#1). When U1 lands we can run this on Ubuntu too.
    runs-on: macos-latest
    # Run on every PR + push so a submodule pointer bump or a Fortran
    # source change is caught immediately.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install gfortran via brew
        run: |
          brew install gfortran || brew install gcc
          which gfortran && gfortran --version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Regenerate goldens against committed and diff
        run: python scripts/generate_goldens.py --check
